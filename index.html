<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background-color: #f4f4f9; }
        input { padding: 10px; width: 300px; font-size: 16px; margin-bottom: 20px; }
        .btn { padding: 10px 20px; font-size: 16px; cursor: pointer; color: white; border: none; border-radius: 5px; margin: 5px; }
        .btn-blue { background-color: #007bff; }
        .btn-green { background-color: #28a745; } 
        #qr-box { margin-top: 30px; display: flex; justify-content: center; }
    </style>
</head>
<body>

    <h1>My QR Code Generator</h1>
    <p>Type any link or word below, and watch the QR code appear!</p>

    <input type="text" id="userInput" placeholder="Enter a URL or text...">
    <br>
    
    <button class="btn btn-blue" onclick="generateQR()">Generate QR Code</button>
    <button class="btn btn-green" onclick="downloadQR()">Download QR Code</button>

    <div id="qr-box"></div>

    <script>
        function generateQR() {
            let text = document.getElementById("userInput").value;
            let qrBox = document.getElementById("qr-box");
            
            qrBox.innerHTML = ""; 

            if (text) {
                new QRCode(qrBox, {
                    text: text,
                    width: 200,
                    height: 200
                });
            } else {
                alert("Please type something first!");
            }
        }

        function downloadQR() {
            let canvas = document.querySelector("#qr-box canvas");
            
            if (canvas) {
                let link = document.createElement("a");
                link.href = canvas.toDataURL("image/png");
                link.download = "My_QR_Code.png";
                link.click();
            } else {
                alert("Please generate a QR code first!");
            }
        }
    </script>
</body>
</html>
